[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libcity"
version = "0.4.0.dev0"
description = "A library for urban spatial-temporal prediction"
readme = "readme.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "torch>=2.6,<3", "numpy>=2,<3", "pandas>=2.2,<4",
  "scipy>=1.13,<2", "scikit-learn>=1.5,<2",
  "tqdm>=4.66,<5", "tabulate>=0.9,<1",
  "geopy>=2.4,<3", "networkx>=3,<4",
]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.18,<3"]
graph = ["dgl>=0.6.1"]
dtw = ["fastdtw==0.3.4"]
embeddings = ["gensim>=4.4,<5"]
ode = ["torchdiffeq>=0.2.3"]
statistics = ["statsmodels>=0.11"]
transformer = ["einops>=0.6"]
multispans = ["torch-geometric", "infomap", "einops>=0.6"]
wavelet = ["PyWavelets"]
pdformer = ["fastdtw==0.3.4", "tslearn"]
dev = ["pytest>=8,<10", "build>=1", "packaging>=24", "tensorboard>=2.18,<3"]

[tool.setuptools.packages.find]
include = ["libcity*"]

[tool.setuptools.package-data]
libcity = ["config/runtime/**/*.json", "config/task_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
